name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sgiammori/NootedGreen
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build NootedGreen
        run: xcodebuild -project NootedGreen.xcodeproj -scheme NootedGreen -configuration Release -derivedDataPath build ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: Build HookCase
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project HookCase-master/HookCase.xcodeproj -scheme HookCase -configuration Release -derivedDataPath build-hc ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee hc.log
      - name: Show HookCase errors
        if: always()
        run: grep -E "error:" hc.log | head -40 || echo "no errors"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NootedGreen-build
          path: |
            build/Build/Products/
            build-hc/Build/Products/
