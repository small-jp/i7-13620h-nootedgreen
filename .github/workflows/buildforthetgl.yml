name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sgiammori/NootedGreen
      - name: Build NootedGreen
        run: xcodebuild -project NootedGreen.xcodeproj -scheme NootedGreen -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Build HookCase
        run: xcodebuild -project HookCase-master/HookCase.xcodeproj -scheme HookCase -configuration Release -derivedDataPath build-hc CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-build
          path: |
            build/Build/Products/
            build-hc/Build/Products/
