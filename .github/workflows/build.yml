name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sgiammori/NootedGreen
      - name: Show HookCase folder
        run: ls -R HookCase-master | head -50
      - name: Build NootedGreen
        run: xcodebuild -project NootedGreen.xcodeproj -scheme NootedGreen -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-build
          path: build/Build/Products/
